name: cloudproof

networks:
  raft-net:
    driver: bridge

volumes:
  replica1-data:
  replica2-data:
  replica3-data:
  refund-provider-data:

x-replica: &replica
  build:
    context: ./replica
  init: true
  restart: unless-stopped
  networks:
    - raft-net
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 10s

services:
  replica1:
    <<: *replica
    environment:
      REPLICA_ID: replica1
      NODE_URL: http://replica1:5001
      PORT: 5001
      PEERS: http://replica2:5002,http://replica3:5003
      GATEWAY_URL: http://gateway:4000
      DATA_DIR: /data
    ports:
      - "${REPLICA1_HOST_PORT:-5001}:5001"
    volumes:
      - replica1-data:/data

  replica2:
    <<: *replica
    environment:
      REPLICA_ID: replica2
      NODE_URL: http://replica2:5002
      PORT: 5002
      PEERS: http://replica1:5001,http://replica3:5003
      GATEWAY_URL: http://gateway:4000
      DATA_DIR: /data
    ports:
      - "${REPLICA2_HOST_PORT:-5002}:5002"
    volumes:
      - replica2-data:/data

  replica3:
    <<: *replica
    environment:
      REPLICA_ID: replica3
      NODE_URL: http://replica3:5003
      PORT: 5003
      PEERS: http://replica1:5001,http://replica2:5002
      GATEWAY_URL: http://gateway:4000
      DATA_DIR: /data
    ports:
      - "${REPLICA3_HOST_PORT:-5003}:5003"
    volumes:
      - replica3-data:/data

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: 4000
      REPLICA1_URL: http://replica1:5001
      REPLICA2_URL: http://replica2:5002
      REPLICA3_URL: http://replica3:5003
      REDIS_URL: redis://redis:6379
    ports:
      - "${GATEWAY_HOST_PORT:-4000}:4000"
    depends_on:
      - replica1
      - replica2
      - replica3
      - redis
    networks:
      - raft-net
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  refund-provider:
    build:
      context: ./refund-provider
    init: true
    restart: unless-stopped
    environment:
      PORT: 6000
      DATA_FILE: /data/refunds.json
    ports:
      - "${REFUND_PROVIDER_HOST_PORT:-6000}:6000"
    volumes:
      - refund-provider-data:/data
    networks:
      - raft-net
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s


  reality-harness:
    profiles: ["research"]
    build:
      context: .
      dockerfile: Dockerfile.reality
    environment:
      RAFT_REPLICAS_URLS: http://replica1:5001,http://replica2:5002,http://replica3:5003
      REALITY_OUTPUT: /workspace/web/reality-run.json
    volumes:
      - ./web:/workspace/web
    depends_on:
      - replica1
      - replica2
      - replica3
    networks:
      - raft-net
    security_opt:
      - no-new-privileges:true
    restart: "no"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks:
      - raft-net
    security_opt:
      - no-new-privileges:true
