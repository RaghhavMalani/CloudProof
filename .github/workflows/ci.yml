name: test-build-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: replica/package-lock.json
      - run: npm ci
        working-directory: replica
      - run: npm test
        working-directory: replica
      - name: deterministic simulator and flight-recorder tests
        run: node --test sim/*.test.js packages/*/*.test.js refund-provider/*.test.js tools/*.test.js
      - name: materialized schedule search campaign
        run: node sim/search.js --runs 100 --no-shrink
      - name: correct agent runtime search campaign
        run: node sim/agent-search.js --workflow refund --runs 1000 --seed 1337 --mutant correct --no-shrink
      - name: autonomous agent mutant kill benchmark
        run: node sim/agent-search.js --benchmark --runs 100 --seed 1337
      - name: correct multi-agent shared-state campaign
        run: node sim/multi-agent-search.js --runs 1000 --seed 1337 --mutant correct --no-shrink --no-artifacts
      - name: multi-agent race mutant kill benchmark
        run: node sim/multi-agent-search.js --benchmark --runs 100 --seed 1337 --no-artifacts
      - name: CloudProof executable twin acceptance gate
        run: node sim/cloud-search.js --benchmark --runs 10 --seed 1337 --no-artifacts
      - name: CloudProof Phase II-A dataset and evaluation smoke gate
        run: >-
          node tools/cloudproof-dataset.js
          --simulations 34
          --minimum-simulations 34
          --seed 43000
          --iterations 10
          --budgets 2,4,8
          --out artifacts/cloudproof/research-ci
      - name: CloudProof Phase II-A.2 causal corpus smoke gate
        run: >-
          node tools/cloudproof-causal-corpus.js
          --simulations 160
          --seed 61000
          --minimum-trajectories 160
          --minimum-matched-pairs 4
          --minimum-discordant-pairs 0
          --pairs 24
          --budgets 2,4,8
          --workers 2
          --shortcut-auroc-hard-max 1
          --permutation-mean-band 1
          --permutation-trial-band 1
          --out artifacts/cloudproof/causal-corpus-ci
      # Every source file, found rather than listed. The previous version named
      # raft.js and index.js explicitly, so log-store.js and state-machine.js
      # were never checked once they were split out — the same class of omission
      # that left them out of the Docker image.
      - name: syntax check every module
        run: |
          find replica refund-provider serving tools sim packages apps -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
      - name: generated web assets are current
        run: |
          node tools/build-web.js
          if [ -n "$(git status --porcelain -- web)" ]; then
            echo "::error::Generated web assets are out of date. Run node tools/build-web.js and commit the result."
            git status --short -- web
            git diff -- web
            exit 1
          fi
      # The serving tier and tools require modules across directories. A build
      # of the image is the only thing that proves those paths resolve, but this
      # catches a missing dependency before waiting on a container build.
      - name: serving dependencies install
        run: npm install --omit=dev
        working-directory: serving

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: replica
            dockerfile: replica/Dockerfile
            context: replica
          - component: gateway
            dockerfile: gateway/Dockerfile
            context: .
          - component: refund-provider
            dockerfile: refund-provider/Dockerfile
            context: refund-provider
          # Built from the repo root because it carries three entrypoints —
          # the embedding service, the dashboard and the artifact seed job —
          # which live in two directories.
          - component: embedding
            dockerfile: Dockerfile.serving
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: miniraft-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: miniraft-${{ matrix.component }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/raghhavmalani/miniraft-${{ matrix.component }}:latest
            ghcr.io/raghhavmalani/miniraft-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}

  agent-raft-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: live Raft-backed crash-boundary and single/multi-agent counterexample campaign
        run: node tools/agent-raft-compose-test.js
