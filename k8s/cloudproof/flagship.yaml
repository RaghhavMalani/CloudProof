apiVersion: v1
kind: Namespace
metadata:
  name: cloudproof
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cloudproof
spec:
  selector:
    app.kubernetes.io/name: cloudproof-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cloudproof
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudproof-api
      annotations:
        cloudproof.io/version: v41
    spec:
      nodeSelector:
        miniraft.io/tier: consensus
      tolerations:
        - key: miniraft.io/tier
          operator: Equal
          value: consensus
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudproof-api
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 12
            periodSeconds: 1
            failureThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: cloudproof
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: cloudproof
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 4
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
