apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: cloudproof
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudproof-loadgen
    spec:
      nodeSelector:
        cloudproof.io/tier: system
      containers:
        - name: loadgen
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - while true; do wget -q -O /dev/null http://api.cloudproof.svc/ || true; done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
