apiVersion: v1
kind: Namespace
metadata:
  name: cloudproof-raft
---
apiVersion: v1
kind: Service
metadata:
  name: raft
  namespace: cloudproof-raft
  labels:
    app.kubernetes.io/name: cloudproof
    app.kubernetes.io/component: replica
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cloudproof
    app.kubernetes.io/component: replica
  ports:
    - name: raft
      port: 5000
      targetPort: raft
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
  namespace: cloudproof-raft
spec:
  serviceName: raft
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof
      app.kubernetes.io/component: replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudproof
        app.kubernetes.io/component: replica
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5000"
    spec:
      terminationGracePeriodSeconds: 15
      # The consensus tier runs on real nodes, not Fargate. It needs a
      # persistent volume that outlives the pod, a stable network identity, and
      # a long-lived process holding election timers — none of which a
      # serverless runtime provides. The node group is tainted so nothing else
      # drifts onto this capacity; this toleration is what makes it landable.
      nodeSelector:
        cloudproof.io/tier: consensus
      tolerations:
        - key: cloudproof.io/tier
          operator: Equal
          value: consensus
          effect: NoSchedule
      # Two replicas on one node means one node failure can cost the quorum.
      # Required, not preferred: scheduling all three on one node would produce
      # a cluster that looks healthy and cannot survive a single reboot.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudproof
                  app.kubernetes.io/component: replica
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: raft
          image: ghcr.io/raghhavmalani/cloudproof-replica:latest
          imagePullPolicy: Always
          ports:
            - name: raft
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: RAFT_REPLICAS
              value: "3"
            - name: RAFT_SERVICE
              value: raft
            - name: DATA_DIR
              value: /data
            - name: GATEWAY_URL
              value: http://gateway:4000
          volumeMounts:
            - name: raft-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: raft
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: raft
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: raft-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Named explicitly rather than relying on the cluster default: EKS
        # ships gp2 as default, and the append-only log is fsync-bound, which
        # is the case where gp2's size-linked IOPS hurt most. Terraform creates
        # this class with WaitForFirstConsumer so the volume is provisioned in
        # whichever AZ the scheduler picks.
        storageClassName: gp3
        resources:
          requests:
            storage: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: raft-quorum
  namespace: cloudproof-raft
spec:
  # Voluntary maintenance must leave the two members required for quorum.
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof
      app.kubernetes.io/component: replica
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cloudproof-raft
spec:
  selector:
    app.kubernetes.io/name: cloudproof
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cloudproof-raft
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudproof
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cloudproof-raft
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cloudproof
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cloudproof-raft
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudproof
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/raghhavmalani/cloudproof-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: REPLICA1_URL
              value: http://raft-0.raft:5000
            - name: REPLICA2_URL
              value: http://raft-1.raft:5000
            - name: REPLICA3_URL
              value: http://raft-2.raft:5000
            - name: REDIS_URL
              value: redis://redis:6379
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /gateway-status
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-availability
  namespace: cloudproof-raft
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudproof
      app.kubernetes.io/component: gateway
